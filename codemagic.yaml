workflows:
  android-aab:
    name: Build FocusLock AAB
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Unzip project
        script: |
          unzip -o FocusLock.zip
          ls -la
      - name: Build AAB
        script: |
          cd FocusLock
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon
    artifacts:
      - FocusLock/app/build/outputs/bundle/release/*.aab
      - app/build/outputs/bundle/release/*.aab
